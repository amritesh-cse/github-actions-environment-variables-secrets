name: Environment Variables
on:
  workflow_dispatch
env:
  DAY_OF_WEEK: Monday
  First_Name: Rosie
jobs:
  greeting_job:
    runs-on: ubuntu-latest
    env:
      Greeting: Hello
    steps:
      - name: "Output using runner specific syntax"
        run: echo "$Greetng $First_Name. Today is $DAY_OF_WEEK!"
        env:
          First_Name: Mona
      - name: "Output using Github Actions context syntax"
        run: echo "${{ env.Greeting }} ${{ env.First_Name }}. Today is ${{ env.DAY_OF_WEEK }}!"
